- name: Return all Started Tasks.
  hosts: zos
  gather_facts: false
  environment: "{{ environment_vars }}"

  tasks:

  - name: Display all started tasks.
  ibm.ibm_zos_core.zos_job_query:
    job_class: STC
    state: "displayed"
    job_name: "all"
       
  register: stcs


   name: Print return info from previous task
    ansible.builtin.debug:
      var: stcs 


